name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write       # to create release (changesets/action)
      issues: write         # to post issue comments (changesets/action)
      pull-requests: write  # to create pull request (changesets/action)
      id-token: write       # required for npm Trusted Publishing (OIDC)

    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          # Note: don't set registry-url here. It writes an .npmrc that
          # expects NODE_AUTH_TOKEN and can interfere with OIDC auth.

      - name: Update npm
        run: npm install -g npm@latest  # Trusted Publishing needs npm >= 11.5.1

      - name: Install Dependencies
        run: npm i

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          version-script: npm run version
          publish-script: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NPM_TOKEN removed: npm authenticates via OIDC instead
